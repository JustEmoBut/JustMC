# Builds signed bundles for Windows, Linux and macOS when a version tag is
# pushed, and attaches them with `latest.json` -- the file the launcher's
# self-update reads from releases/latest -- to a draft release. Publishing the
# draft is what makes it the update every install sees.
#
# The tag must match `version` in tauri.conf.json (and Cargo.toml): the updater
# compares that number, not the tag.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: macos-latest
            args: --target universal-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts; the public half is compiled in so the
          # launcher can verify them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          JUSTLAUNCHER_UPDATER_PUBKEY: ${{ secrets.JUSTLAUNCHER_UPDATER_PUBKEY }}
          # Optional: without it the release offers offline accounts only.
          JUSTLAUNCHER_MSA_CLIENT_ID: ${{ secrets.JUSTLAUNCHER_MSA_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: JustLauncher ${{ github.ref_name }}
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
