# Builds the signed Windows installer when a version tag is
# pushed, and attaches them with `latest.json` -- the file the launcher's
# self-update reads from releases/latest -- to a draft release. Publishing the
# draft is what makes it the update every install sees.
#
# The tag must match `version` in tauri.conf.json (and Cargo.toml): the updater
# compares that number, not the tag.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# A re-pushed tag replaces the run in flight rather than racing it for the
# same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows only, by choice: the launcher is released for Windows, and each
  # build is one long fat-LTO compile. Linux and macOS still build locally.
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # A tag can only read caches saved on itself or on main, so this mostly
      # pays off on a re-run of the same tag.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts; the public half is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: without it the release offers offline accounts only.
          JUSTLAUNCHER_MSA_CLIENT_ID: ${{ secrets.JUSTLAUNCHER_MSA_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: JustLauncher ${{ github.ref_name }}
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # The NSIS installer is the one the updater swaps in; no MSI.
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
