# Builds the signed Windows installer and attaches it, with `latest.json` --
# the file the launcher's self-update reads from releases/latest -- to a draft
# release tagged v<version>. Publishing the draft is what makes it the update
# every install sees.
#
# Started by hand from main (`gh workflow run release.yml`), not by a tag push:
# GitHub lets a run read caches saved on its own ref or on main, never on
# another tag, so a tag-triggered release always compiled from scratch. Run
# from main, each release reuses the last one's compiled dependencies. The
# action creates the tag itself, from `version` in tauri.conf.json.

name: release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # Windows only, by choice: the launcher is released for Windows. Linux and
  # macOS still build locally.
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      # Thin LTO over 16 codegen units instead of the profile's fat LTO and
      # one unit. Measured locally: a cached build 202 s -> 88 s, for an exe
      # 6.2 MB -> 7.7 MB. Local `tauri build` keeps the smaller profile.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts; the public half is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: without it the release offers offline accounts only.
          JUSTLAUNCHER_MSA_CLIENT_ID: ${{ secrets.JUSTLAUNCHER_MSA_CLIENT_ID }}
        with:
          # The action replaces __VERSION__ with tauri.conf.json's version.
          tagName: v__VERSION__
          releaseName: JustLauncher v__VERSION__
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # The NSIS installer is the one the updater swaps in; no MSI.
          args: --bundles nsis --config src-tauri/tauri.release.conf.json

      # A portable copy updates by replacing its own exe (`portable.rs`), so it
      # needs the bare exe, signed like the installer, and its own entry in
      # latest.json -- the key `portable::UPDATER_TARGET` asks for.
      - name: Portable exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:VERSION"
          $name = "JustLauncher_$($env:VERSION)_x64-portable.exe"
          Copy-Item src-tauri/target/release/justlauncher.exe $name
          pnpm tauri signer sign --app-version $env:VERSION $name
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }

          gh release download $tag --pattern latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "latest.json not found on $tag" }
          $manifest = Get-Content latest.json -Raw | ConvertFrom-Json
          $entry = [pscustomobject]@{
            signature = (Get-Content "$name.sig" -Raw).Trim()
            url       = "https://github.com/${{ github.repository }}/releases/download/$tag/$name"
          }
          $manifest.platforms | Add-Member -NotePropertyName windows-x86_64-portable -NotePropertyValue $entry -Force
          $manifest | ConvertTo-Json -Depth 10 | Set-Content latest.json -Encoding utf8NoBOM

          gh release upload $tag $name "$name.sig" latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }
