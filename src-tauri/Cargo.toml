[package]
name = "justlauncher"
version = "0.1.0"
description = "A small, fast Minecraft launcher"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "justlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "sync", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
thiserror = "2"
uuid = { version = "1", features = ["v3", "v4", "serde"] }
dirs = "5"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }

# Small binary: strip symbols, optimise for size, one codegen unit, abort on panic.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }
